# Wuji hand2 (beta1) left-hand joint position limits, radians.
#
# GENERATED from assets/robots/wuji_hand2/mjcf/left.xml by
# scripts/generate_limits_yaml.py -- do not hand-edit. Values are each JOINT's `range`,
# not `actuatorfrcrange`. test_limits_match_mjcf.py fails if this drifts from the MJCF.
#
# Each hand is projected from its own MJCF rather than mirrored from the other, so a revision
# that makes the two diverge shows up here as a changed file instead of a wrong clamp.
#
# The hardware also reports its own limits (wujihandpy read_joint_lower_limit /
# read_joint_upper_limit -- the checked bus reads, not the get_joint_*_limit cache accessors,
# which are unpopulated until an upstream-enabled controller exists); hand_node cross-checks
# these against those at startup and refuses to run on disagreement. This file is what the
# reference trajectories were solved against.
