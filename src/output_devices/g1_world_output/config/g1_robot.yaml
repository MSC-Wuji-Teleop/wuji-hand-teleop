# =============================================================================
# Unitree G1 Robot Unified Configuration File
# =============================================================================
# Single Source of Truth for g1_world_output remapping / IK / control.
#
# Input topics match tianji_world_output (chest-frame PoseStamped from pico_input).
# This package remaps chest -> G1 pelvis (robot base) before Pinocchio/Casadi IK.
# =============================================================================

# G1_29 (the rig's robot): 7 DoF per arm (shoulder pitch/roll/yaw, elbow,
# wrist roll/pitch/yaw). G1_23 (5 DoF per arm) stays supported as a secondary
# target; pose mode (IK) is still G1_23-only.
arm_type: "G1_29"

# DDS / control
# motion_mode true -> rt/arm_sdk: the G1's onboard controller keeps the legs.
# Default for sessions on the real robot. rt/lowcmd (motion_mode false) is
# NOT used by the replay design: it releases the onboard controller and owns
# all 29 motors every cycle, a suspended-robot regime. Bench debugging only.
motion_mode: true
simulation_mode: false   # true -> ChannelFactoryInitialize(1)

# NIC for the Unitree DDS participant. CYCLONEDDS_URI governs only the ROS
# graph: the Unitree SDK builds its own CycloneDDS config and ignores the
# env var, so on a multi-NIC host this parameter is the only way to pin the
# robot link. Empty = SDK default (first interface).
network_interface: ""

# Per-joint limits file for the replay safety chain and the always-on
# 250 Hz DDS clip. Empty = g1_deploy_limits.yaml in this config directory.
limits_file: ""

# Arm kp/kd tiers (spec_1: gains are config, not constants; retuning is a
# config change validated in Stage B). Only arm slots are ever written
# under the LowCmd slot policy, so there is no hold tier.
#   default: the tiers the stack has been running (shoulders/elbows 140/3,
#            wrists 50/2)
#   vendor:  Unitree's g1 arm7 example uniform 60/1.5, selectable fallback
gains:
  profile: default
  profiles:
    default: {arm_kp: 140.0, arm_kd: 3.0, wrist_kp: 50.0, wrist_kd: 2.0}
    vendor:  {arm_kp: 60.0,  arm_kd: 1.5, wrist_kp: 60.0, wrist_kd: 1.5}

# Path to g1_wuji2_description (directory that contains g1_23_wuji2.urdf + meshes/).
# Leave blank to resolve via the g1_wuji2_description package's ament share
# directory; set an absolute path only to override (e.g. a shared install or
# an external mount).
urdf_package_dir: ""
urdf_filename: "g1_23_wuji2.urdf"

# =============================================================================
# World <-> Chest (same convention as tianji_world_output / pico_input)
# =============================================================================
# World / G1 pelvis (ROS REP 103): X=forward, Y=left, Z=up
# Left Chest:  X=forward, Y=down, Z=left  (+90 deg about World X)
# Right Chest: X=forward, Y=up,   Z=right (-90 deg about World X)
world_to_chest_quat:
  left:  [0.7071067811865475, 0.0, 0.0, 0.7071067811865475]
  right: [0.7071067811865475, 0.0, 0.0, -0.7071067811865475]

# Chest-frame origin expressed in G1 pelvis frame (waist locked at zero).
# Approx. shoulder mount from G1 body URDF (waist_roll z + shoulder pitch xyz).
chest_origin_in_pelvis:
  left:  [0.004,  0.100, 0.292]
  right: [0.004, -0.100, 0.292]

# Optional arm-length scale applied to chest-local translation before remap
# (human-ish pico reach -> G1 reach). 1.0 = no scale.
arm_scale: 1.0

# =============================================================================
# Reset / home wrist poses in G1 pelvis frame (meters)
# =============================================================================
reset_wrist_pose:
  left:
    position: [0.30, 0.25, 0.05]
    # Identity rotation (palm forward convention used by G1_23_ArmIK)
    quat: [0.0, 0.0, 0.0, 1.0]
  right:
    position: [0.30, -0.25, 0.05]
    quat: [0.0, 0.0, 0.0, 1.0]

# Default elbow direction echo (G1 Casadi IK does not consume zsp; kept for
# Monitor / recorder parity with tianji_world_output).
default_zsp_para:
  left:  [0, -0.5, -0.3, 0, 0, 0]
  right: [0, 0.5, -0.3, 0, 0, 0]
