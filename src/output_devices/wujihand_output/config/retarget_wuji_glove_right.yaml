# AdaptiveOptimizerAnalytical configuration for Wuji Glove (RIGHT HAND).
# Uses SDK-computed MediaPipe: wuji_sdk emits 21 keypoints directly,
# so no client-side IK is required.
# lp_alpha=0.2 keeps smoothing light because the SDK output is already filtered.

optimizer:
  type: "AdaptiveOptimizerAnalytical"
  # Wuji Hand 2 (Beta 2), official vendor URDF. Provenance, SHA-256 and the
  # joint-order contract: src/wujihand_urdf/README.md. Relative to this config's
  # own directory, which --symlink-install resolves back to the source tree.
  urdf_path: "../../../wujihand_urdf/wujihand_right.urdf"
  # Hand 2 uses anatomical link names (r_wrist / r_index_finger_middle), so
  # link_naming maps the optimizer's logical roles onto them. Values are
  # upstream's, from example/config/adaptive_analytical_wuji_glove_wuji_hand_2_right.yaml.
  link_naming:
    prefix:  "r_"
    palm:    "wrist"
    fingers: [thumb, index_finger, middle_finger, ring_finger, pinky]
    pip:     "{finger}_middle"        # PIP
    dip:     "{finger}_distal"        # DIP
    tip:     "{finger}_tip"           # fingertip
    link1:   "{finger}_proximal_abd"  # MCP abduction link (finger-plane ref)

retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  w_pos: 1.0
  w_dir: 2.0
  scaling: 1.0
  w_full_hand: 1.0
  thumb_skip_pip: true   # wuji_glove SDK reconstructs thumb MCP (kp[2]) inaccurately; drop it from FullHandVec loss
  # Style penalty: discourage hyperextension and uncoupled PIP/DIP curl
  w_hyper: 1.0           # PIP/DIP joints below soft_min are penalized quadratically
  soft_min: 0.0          # joint angle threshold (rad); 0 = no negative angles allowed
  w_couple: 0.1          # DIP pulled toward couple_ratio * PIP per finger
  couple_ratio: 0.7      # biomechanical (DIP curls ~70% of PIP)
  lp_alpha: 0.2

  # FLAGGED, NOT RETUNED. The pinky values were fitted against Wuji Hand 1,
  # whose pinky segments differ from Hand 2's: PIP 43.9 vs 33.6 mm (-10.3),
  # DIP 29.5 vs 27.5 mm (-2.0), TIP 26.7 vs 24.8 mm (-1.9). Hand 2's pinky is
  # SHORTER, so a >1 scale that compensated Hand 1 over-reach has no evidence
  # behind it now. Upstream's Hand 2 glove config ships all 1.0. Left as-is
  # because retuning needs glove hardware, which is not available offline.
  # Re-derive with tuning_tool.py against Hand 2 before trusting glove teleop.
  segment_scaling:
    thumb:  [1.0, 1.0, 1.0]
    index:  [1.0, 1.0, 1.0]
    middle: [1.0, 1.0, 1.0]
    ring:   [1.0, 1.0, 1.0]
    pinky:  [1.05, 1.05, 1.1]

  # segment_scaling:
  #   thumb:  [0.99, 0.935, 0.935]
  #   index:  [1.15, 1.15, 1.1]
  #   middle: [1.1, 1.1, 1.05]
  #   ring:   [1.1, 1.1, 1.05]
  #   pinky:  [1.2, 1.2, 1.2]

  # segment_scaling:
  #   thumb:  [0.98, 1, 1]
  #   index:  [1.1, 0.989, 1.03]
  #   middle: [1.10, 0.96, 0.96]
  #   ring:   [1.1, 0.97, 0.99]
  #   pinky:  [1.105, 1.15, 1.15]

  pinch_thresholds:
    index:  { d1: 2.0, d2: 4.0 }
    middle: { d1: 2.0, d2: 4.0 }
    ring:   { d1: 2.0, d2: 4.0 }
    pinky:  { d1: 2.0, d2: 4.0 }
  # Root-frame correction for Wuji Hand 2, not a tuned bias. Hand 2's r_wrist
  # frame is rotated 178.45 deg from Hand 1's right_palm_link frame (measured on
  # the URDFs; closest canonical form Rz(-90)Ry(180), residual 7.6 deg). Values
  # are upstream's, from wuji-retargeting v2026.8.17.
  #
  # This REPLACES the previous (-5, -5, -20), which was a small glove calibration
  # bias fitted in Hand 1's frame. That frame no longer applies, so the bias was
  # dropped rather than composed on top. If glove teleop shows a systematic
  # offset after this change, re-derive it with calibrate_offset.py against
  # Hand 2; do not restore the old numbers.
  mediapipe_rotation:
    x: 0.0
    y: 180.0
    z: -90.0
  wrist_offset_cm: [0.0, 0.0, 0.0]   # disabled: SDK uses per-SN calibrated URDF, no extra bias needed
  thumb_offset_cm: [0.0, 0.0, 0.0]   # disabled: same reason

wuji_glove:
  device_name: "glove"
