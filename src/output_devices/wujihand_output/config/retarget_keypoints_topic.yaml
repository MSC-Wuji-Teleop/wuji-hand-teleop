# AdaptiveOptimizerAnalytical configuration for input_source=keypoints_topic
# -- topic-fed MediaPipe (21,3) keypoints in meters, e.g. the SOT bundle's
# fused SMPL-X hand targets replayed by replay. Shared by both sides
# (hand_side is injected per controller process at load).
#
# Deliberately minimal: optimizer defaults only. The glove config's
# mediapipe_rotation / thumb_skip_pip and the video config's z_scale /
# segment corrections compensate sensor-specific bias (glove SDK thumb
# reconstruction, monocular depth compression). Fused SMPL-X keypoints are
# metrically consistent 3D and the bundle's own hand solve used official
# session defaults (target_meta.json "hand_solver"), so no bias terms here.
# Tune against reference videos only with evidence, per TUITION.md Sec 4.

optimizer:
  type: "AdaptiveOptimizerAnalytical"

retarget:
  lp_alpha: 0.2
