# ===========================================
# Wuji Hand Teleop Docker Compose
# ===========================================
#
# Prerequisites (host):
#   sudo apt-get install docker.io docker-compose-plugin
#   sudo usermod -aG docker $USER && newgrp docker
#   sudo apt-get install git-lfs && git lfs install && git lfs pull
#
# Usage:
#   cd docker
#   docker compose build                    # Build the image
#   docker compose up -d                    # Start the container
#   docker exec -it wuji-hand-teleop bash   # Open a shell inside
#
# Start teleop inside the container:
#   ros2 launch wuji_teleop_bringup wuji_teleop_hand.launch.py
#
# Accelerate the build behind a slow PyPI mirror:
#   docker compose build --build-arg PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
#
# ===========================================

services:
  teleop:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: wuji-hand-teleop:latest
    container_name: wuji-hand-teleop
    # Auto-start on boot and after a crash, so a host reboot brings the teleop
    # container back without a manual `docker start`. 'unless-stopped' still
    # honors an explicit `docker stop` by the operator.
    restart: unless-stopped
    # --- Network & IPC ---
    network_mode: host                  # ROS2 DDS multi-host discovery
    ipc: host                           # ROS2 shared-memory transport

    # Lets entrypoint.sh pin per-glove /32 routes when the harness wires each
    # glove receiver to a separate NIC on the same subnet (see
    # scripts/setup_glove_routes.sh). Editing the host routing table needs
    # NET_ADMIN; harmless on single-NIC setups where the script is a no-op.
    cap_add:
      - NET_ADMIN

    # --- PID 1 management ---
    # PC-Service runs as a background process; init reaps zombies + forwards signals.
    init: true

    # --- GPU (optional, NVENC hardware H.264 encoding) ---
    # For the camera -> PICO video path in src/camera/, which is currently
    # unwired pending the G1 head cameras. Uncomment when an NVIDIA GPU is
    # available; host needs nvidia-container-toolkit. Without a GPU the
    # encoder falls back to libx264 automatically (no functional change).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

    # --- Device access ---
    device_cgroup_rules:
      # librealsense uses the V4L2 backend on Linux, so RealSense needs 81 too.
      - 'c 81:* rmw'                   # video4linux (UVC + RealSense video nodes)
      - 'c 189:* rmw'                  # USB (Wuji Hand, RealSense, PICO via ADB)

    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - TZ=Asia/Shanghai

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw  # GUI passthrough (rviz, rqt)
      - /dev:/dev:rw                       # device hot-plug
      - ../src:/home/wuji/ros2_ws/src:rw   # bind-mount the host source tree
      # SOT handoff bundle (recorded samples for replay). Read-only:
      # reference data, nothing in the stack may write into it. Lives at the
      # repo root rather than src/ so colcon never scans its ~GBs of media.
      - ../RobotSTAR_demos:/home/wuji/ros2_ws/RobotSTAR_demos:ro
      # --- Wuji Studio calibration ---
      # Studio writes <SN>.toml to host ~/.wuji/sdk/params/; SDK reads it in
      # the container. entrypoint.sh chowns this if docker auto-created it as root.
      - ${HOME}/.wuji:/home/wuji/.wuji:rw

    # --- Log rotation (avoid filling disk during long runs) ---
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

    user: wuji
    stdin_open: true
    tty: true
    command: bash

  # ---------------------------------------------------------------------
  # g1_world_output: Unitree G1 dual-arm teleop node.
  # Separate image/container from `teleop` (see src/output_devices/
  # g1_world_output/docker/Dockerfile for why: it needs a Pinocchio+CasADi
  # build that's mutually incompatible, NumPy-version-wise, with the pip
  # Pinocchio build the hand-teleop stack uses). Talks to `teleop` purely
  # over ROS2/DDS via host networking + the same ROS_DOMAIN_ID/cyclonedds
  # config, not through a shared filesystem or Python environment.
  #
  # profiles: gated behind "g1" so a bare `docker compose up/build/down`
  # (the hand-only workflow) never touches this service -- without a real G1
  # it would just build/start and sit waiting on DDS forever. Opt in with
  # `docker compose --profile g1 up -d`, or name the service directly:
  # `docker compose up -d g1_world_output`.
  # ---------------------------------------------------------------------
  g1_world_output:
    profiles: ["g1"]
    build:
      context: ..
      dockerfile: src/output_devices/g1_world_output/docker/Dockerfile
    image: g1-world-output:latest
    container_name: g1-world-output
    restart: unless-stopped

    network_mode: host   # ROS2 DDS discovery with `teleop` + direct G1 NIC access
    ipc: host

    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - TZ=Asia/Shanghai

    volumes:
      - ../src/output_devices/g1_world_output:/home/wuji/ros2_ws/src/g1_world_output:rw
      # Read-only: same host files `teleop` sees, so a regenerated model
      # can't go stale in only one of the two images (see g1_world_output's
      # own Dockerfile comment).
      - ../src/g1_wuji2_description:/home/wuji/ros2_ws/src/g1_wuji2_description:ro

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

    user: wuji
    stdin_open: true
    tty: true
